<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons (browser tab icon).
         logo.jpeg is used everywhere; if you later add a transparent PNG, swap
         these hrefs to /logo.png for cleaner edges on retina displays. -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />

    <!-- Primary SEO -->
    <title>ZentoMart — Luxury Women's Handbags | Designed in Paris, Made in Italy</title>
    <meta name="description" content="Discover ZentoMart's premium handbag atelier — totes, crossbody bags, and clutches handcrafted from heritage leather. Free shipping on orders over Rs. 5,000." />
    <meta name="keywords" content="luxury handbags, designer handbags, women's handbags, leather totes, crossbody bags, clutches, ZentoMart" />
    <meta name="author" content="ZentoMart" />
    <meta name="theme-color" content="#4c5c2f" />
    <link rel="canonical" href="https://www.zentomart.shop/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZentoMart" />
    <meta property="og:title" content="ZentoMart — Luxury Women's Handbags" />
    <meta property="og:description" content="Premium designer handbags crafted with elegance. Heritage craftsmanship for the woman who carries her own story." />
    <meta property="og:url" content="https://www.zentomart.shop/" />
    <meta property="og:image" content="https://www.zentomart.shop/logo.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card (X / Twitter previews) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZentoMart — Luxury Women's Handbags" />
    <meta name="twitter:description" content="Premium designer handbags crafted with elegance. Heritage craftsmanship for the woman who carries her own story." />
    <meta name="twitter:image" content="https://www.zentomart.shop/logo.jpeg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
